[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphaess-modbus"
version = "0.1.0"
description = "Read and control an AlphaESS storage inverter over Modbus."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "alphaess-modbus contributors" }]
keywords = ["modbus", "alphaess", "inverter", "solar", "battery", "home-assistant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = ["modbus-connection[tmodbus]>=4.6.1"]

[project.urls]
Homepage = "https://github.com/balloobbot/alphaess-modbus"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14",
    "mypy>=1.19",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alphaess_modbus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
